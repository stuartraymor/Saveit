<!doctype html><html><head><meta charset="utf-8"><title>Saveit Quick Markup</title><style>body{margin:0;background:#16181a;color:#e8eaec;font:14px 'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh}header{display:flex;gap:8px;padding:12px;flex-wrap:wrap;background:#26292d}button,select,input{font:inherit;background:#30343a;color:inherit;border:1px solid #50565c;border-radius:6px;padding:7px}button{cursor:pointer}button.primary{background:#2db3a0;color:#06211d}main{overflow:auto;flex:1;display:grid;padding:16px}canvas{max-width:100%;max-height:100%;margin:auto;touch-action:none;background:repeating-conic-gradient(#222 0 25%,#333 0 50%) 0/16px 16px}input[type=text]{width:160px}footer{padding:8px 12px;color:#aab2b9}</style></head><body><header><b style="align-self:center">Quick markup</b><select id="tool"><option value="arrow">Arrow</option><option value="rect">Rectangle</option><option value="pen">Pen</option><option value="text">Text</option></select><input type="color" id="color" value="#e5372a"><input type="text" id="text" placeholder="Text to place"><button id="undo">Undo</button><button id="copy" class="primary">Copy & finish</button><button id="edit">Open editor</button></header><main><canvas id="canvas"></canvas></main><footer>Drag to annotate. Choose Text, enter text, then click to place it. Escape closes without changing the capture.</footer><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),shapes=[];let image=null,drag=null;
function draw(preview){if(!image)return;g.clearRect(0,0,c.width,c.height);g.drawImage(image,0,0);for(const s of [...shapes,...(preview?[preview]:[])]){g.save();g.strokeStyle=g.fillStyle=s.color;g.lineWidth=Math.max(3,c.width/300);g.lineCap='round';if(s.tool==='text'){g.font=`${Math.max(22,c.width/40)}px Segoe UI`;g.textBaseline='top';g.fillText(s.text,s.x1,s.y1)}else if(s.tool==='rect')g.strokeRect(s.x1,s.y1,s.x2-s.x1,s.y2-s.y1);else{g.beginPath();if(s.tool==='pen')s.points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));else{g.moveTo(s.x1,s.y1);g.lineTo(s.x2,s.y2)}g.stroke();if(s.tool==='arrow'){const a=Math.atan2(s.y2-s.y1,s.x2-s.x1),len=Math.max(16,c.width/55);g.beginPath();g.moveTo(s.x2,s.y2);g.lineTo(s.x2-len*Math.cos(a-.5),s.y2-len*Math.sin(a-.5));g.lineTo(s.x2-len*Math.cos(a+.5),s.y2-len*Math.sin(a+.5));g.closePath();g.fill()}}g.restore()}}
window.quick.onImage(async u=>{image=new Image();image.src=u;await image.decode();c.width=image.naturalWidth;c.height=image.naturalHeight;draw()});function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
c.onpointerdown=e=>{if(!image||e.button!==0)return;const p=point(e);drag={tool:document.querySelector('#tool').value,color:document.querySelector('#color').value,x1:p.x,y1:p.y,x2:p.x,y2:p.y,points:[[p.x,p.y]],text:document.querySelector('#text').value};if(drag.tool==='text'){shapes.push(drag);drag=null;draw()}else c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;const p=point(e);drag.x2=p.x;drag.y2=p.y;drag.points.push([p.x,p.y]);draw(drag)};c.onpointerup=()=>{if(drag){shapes.push(drag);drag=null;draw()}};document.querySelector('#undo').onclick=()=>{shapes.pop();draw()};for(const action of ['copy','edit'])document.querySelector('#'+action).onclick=()=>{draw();window.quick.done({action,url:c.toDataURL()})};document.addEventListener('keydown',e=>{if(e.key==='Escape')window.quick.done(null)});
</script></body></html>
