<!doctype html><html><head><meta charset="utf-8"><title>Saveit Manual Scroll</title><style>body{background:#20262a;color:#eef2f4;font:14px 'Segoe UI';margin:14px}button{padding:8px 14px;margin:0 4px;background:#303b41;color:inherit;border:1px solid #53646e;border-radius:6px;cursor:pointer}p{margin:8px 0}</style></head><body><b>Manual scrolling capture</b><p id="state">Capturing first frame…</p><p>Scroll inside your target by less than one screen at a time.</p><button id="add">Add frame</button><button id="finish">Finish</button><button id="cancel">Cancel</button><script>for(const cmd of ['add','finish','cancel'])document.querySelector('#'+cmd).onclick=()=>window.manual.send(cmd);window.manual.onStatus(m=>document.querySelector('#state').textContent=m);</script></body></html>
