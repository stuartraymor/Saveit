<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saveit</title>
<style>
/* Layout: desktop editor — title bar with capture, labeled tool ribbon, canvas with properties on the right, recent-captures tray, status bar. Single dark look, chosen deliberately. */
:root{
  --bg:#1e2124; --chrome:#16181a; --panel:#26292d; --panel-2:#30343a; --line:#3a3f45; --fg:#e8eaec; --muted:#9aa1a8;
  --accent:#2db3a0; --accent-fg:#06211d; --accent-soft:#1d3d39; --rec:#e5483b; --stage:#121416; --check:#1a1d20; --sel:#5aa2ff;
  --f-ui:"Segoe UI Variable Text","Segoe UI",Manrope,system-ui,sans-serif; --f-mono:"Cascadia Mono","IBM Plex Mono",Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13px;overflow:hidden;margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app.vmode{grid-template-columns:1fr!important}.app.vmode .props{display:none}
.devsel{max-width:180px}
.top .btn.camgear{width:28px;min-width:28px;padding:0!important;justify-content:center;font-size:13px!important}
.props .btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent)}.props .tfmt{gap:4px;flex-wrap:nowrap}.props .tfmt .btn{min-width:0;flex:1;padding:6px 4px;justify-content:center}.props .tfmt [data-talign=left]{margin-left:8px}
.rail>.tool[data-t=select]{min-width:82px!important;flex-basis:82px}.rail>.tool.on80{background:rgb(47 158 68/.28);color:var(--fg)}.rail>.tool.on80 svg{color:#51cf66}.rail>.tool:disabled{opacity:.38;cursor:default;background:transparent}.rail>.tool[data-t=select] svg{width:46px}.rail>.tool[data-t=selection]{min-width:64px!important;flex-basis:64px}
.app{height:100%;display:grid;grid-template-columns:1fr 288px;grid-template-rows:auto auto 1fr auto auto;grid-template-areas:"top top" "rail rail" "stage props" "tray tray" "status status"}
.tleft{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1;min-width:0}.top .acts{display:grid!important;grid-template-columns:repeat(4,auto);grid-auto-flow:row;gap:6px 8px;align-items:center;justify-items:stretch;flex:none}.top .acts .btn,.top .acts select{width:100%}.top{padding-top:5px!important;padding-bottom:5px!important}
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--chrome);border-bottom:1px solid var(--line);flex-wrap:wrap}
.leadrow .btn#widgetBtn{padding:3px 9px;font-size:11px;background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.leadrow .btn#widgetBtn:hover{filter:brightness(1.1);background:var(--accent)}
.lead{display:flex;flex-direction:column;align-items:stretch;gap:6px;margin-right:6px}
.leadrow{display:flex;align-items:center;gap:10px}
.lead .cap{width:100%}.lead .cap button{width:100%;justify-content:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-right:4px}
.brand .ver{font-weight:600;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.brand i::after{content:"";width:10px;height:10px;border:2px dashed var(--accent-fg);border-radius:2px}
.cap{display:flex;border-radius:999px;overflow:hidden}
.cap button{border:0;background:var(--rec);color:#fff;padding:7px 16px 7px 12px;cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:700}
.cap button:hover{filter:brightness(1.08)}
.cap button.rec{background:var(--rec)}
.cap button:focus-visible,.btn:focus-visible,.tool:focus-visible,.thumb:focus-visible,.qs button:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.seg{display:flex;gap:2px;padding:2px;background:var(--panel);border-radius:8px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
.sp{flex:1}
.acts{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:nowrap}
.top label.sel{gap:5px}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg,.cap svg{width:16px;height:16px;flex:none}
label.sel{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600}
select,input[type=number],input[type=text]{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
/* tool ribbon */
.rail{grid-area:rail;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:stretch;gap:2px;padding:4px 16px;position:relative;z-index:3}
.tool{min-width:60px;padding:5px 4px 4px;border:0;border-radius:7px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);flex:none;font-size:11px;font-weight:600}
.tool:hover{background:var(--panel-2);color:var(--fg)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.tool[aria-pressed="true"] svg{color:var(--accent)}
.tool svg{width:22px;height:22px}
.rail hr{border:0;border-left:1px solid var(--line);margin:6px 6px;flex:none}
/* stage */
.stage{grid-area:stage;overflow:auto;background:var(--stage);position:relative;min-width:0;display:grid}
.stage .inner{margin:auto;padding:28px;position:relative}
.stage.panning81,.stage.panning81 *{cursor:grabbing!important}
#cv{display:block;background-image:conic-gradient(var(--check) 25%,transparent 0 50%,var(--check) 0 75%,transparent 0);background-size:16px 16px;box-shadow:0 4px 24px rgb(0 0 0/.5);touch-action:none}
.stage.empty .inner{display:none}
.drop{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:12px;display:none;place-items:center;font-weight:700;background:rgb(29 61 57/.7);z-index:5}
.stage.dragging .drop{display:grid}
video.player{max-width:100%;max-height:100%;margin:auto;display:block;background:#000}
#te{position:absolute;z-index:4;border:1px dashed var(--sel);background:transparent;outline:none;resize:none;overflow:hidden;padding:0;margin:0;line-height:1.2;white-space:pre}
/* step guide */
.guide{overflow:auto;padding:28px 16px;display:grid;justify-items:center;align-content:start}
.gpage{position:relative;width:min(860px,100%);background:#ffffff;color:#1b1f23;border-radius:6px;box-shadow:0 6px 30px rgb(0 0 0/.5);padding:40px 48px 32px;display:flex;flex-direction:column;gap:22px}
.gpage input,.gpage textarea{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;width:100%}
.gpage input:hover,.gpage textarea:hover{border-color:#d5dadf}
.gpage input:focus,.gpage textarea:focus{outline:none;border-color:#2db3a0;background:#f6fbfa}
.gpage .gtitle{font-size:28px;font-weight:700;margin-left:-8px}
.gmeta{color:#5f6b75;font-size:13px;margin-top:-16px}
.gstep{display:grid;grid-template-columns:44px 1fr;gap:6px 14px;padding-top:18px;border-top:1px solid #e3e7ea}
.gnum{width:36px;height:36px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;margin-top:2px}
.ghead{display:flex;gap:8px;align-items:center;min-width:0}
.gpage .gst{font-size:18px;font-weight:700;flex:1;min-width:0}
.gact{display:flex;gap:2px;flex:none}
.gact button{border:1px solid #d5dadf;background:#fff;color:#33404a;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px;font-weight:600}
.gact button:hover{border-color:#2db3a0;color:#0e6f63}
.gpage .gtx{grid-column:2;resize:vertical;min-height:38px;font-size:14px;line-height:1.45}
.gimgwrap{grid-column:2;position:relative}
.gimg{display:block;width:100%;border:1px solid #d5dadf;border-radius:4px;cursor:pointer}
.gimgwrap:hover .gimg{outline:2px solid #2db3a0;outline-offset:2px}
.gimgwrap span{position:absolute;right:8px;top:8px;background:rgb(22 24 26/.85);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;opacity:0;transition:opacity .12s;pointer-events:none}
.gimgwrap:hover span{opacity:1}
.gempty{color:#5f6b75;text-align:center;padding:24px}
.backbar{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
#gOver{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.gpage.drawing{cursor:crosshair}
.gpage.drawing input,.gpage.drawing textarea,.gpage.drawing img{cursor:crosshair}
#pte{position:absolute;z-index:4;border:1px dashed #1677ff;background:rgba(255,255,255,.85);outline:none;resize:none;overflow:hidden;padding:0;margin:0;line-height:1.2;white-space:pre;font-weight:700}
.gact button:disabled{opacity:.4;cursor:default}
/* properties */
.props{grid-area:props;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:18px}
.props h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grp{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row > span{min-width:58px;color:var(--muted);font-weight:600}
.qs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qs button{aspect-ratio:1.25;border-radius:7px;border:1px solid var(--line);background:#f4f5f6;cursor:pointer;padding:0;display:grid;place-items:center;overflow:hidden}
.qs button canvas{width:100%;height:100%;display:block}
.qs button[aria-pressed="true"]{outline:2px solid var(--sel);outline-offset:1px}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--sel)}
.sw button.none{background:linear-gradient(135deg,transparent 45%,var(--rec) 45% 55%,transparent 55%),var(--panel-2)}
input[type=color]{width:26px;height:24px;border:1px solid var(--line);border-radius:6px;padding:1px;background:var(--panel-2)}
input[type=range]{flex:1;accent-color:var(--accent);min-width:80px}
.val.num{width:56px;background:var(--bg,#fff);color:inherit;border:1px solid var(--line,#ccc);border-radius:5px;padding:2px 4px}
.val{font-family:var(--f-mono);font-size:12px;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer}
.chk input{accent-color:var(--accent)}
.hint{color:var(--muted);font-size:12px;line-height:1.45;margin:0}
.kbd{font-family:var(--f-mono);font-size:11px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2)}
details.more summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
/* tray + status */
.tray{grid-area:tray;background:var(--chrome);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px;min-width:0}
.tray .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tcol{display:flex;flex-direction:column;gap:6px;align-items:stretch;justify-content:center;flex:none}.tcol .btn{justify-content:center;white-space:nowrap}.tcol .lbl{text-align:center}.tray.min{justify-content:flex-end;padding:4px 16px}.tray.min .lbl,.tray.min .thumbs{display:none}.tray.min .tcol{flex-direction:row}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;flex:1;min-width:0}
.tcell{flex:none;width:104px;display:flex;flex-direction:column;gap:3px}
.tcell .tn{font-size:10px;line-height:1.25;color:var(--muted);max-height:38px;overflow:hidden;text-align:center;word-break:break-word}
.thumb{flex:none;width:100px;height:68px;border-radius:6px;border:2px solid transparent;background:var(--panel) center/cover no-repeat;cursor:pointer;position:relative;padding:0;box-shadow:0 0 0 1px var(--line)}
.thumb[aria-current="true"]{border-color:var(--accent)}
.modal .box.lib{width:min(1000px,100%);max-height:86vh;display:flex;flex-direction:column}
.lib .lh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lib .lh h2{margin:0}.lib .lh #libFoldersBtn{margin-right:auto}.lib .lh #libFoldersBtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.lib .ltb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding:8px 10px;background:var(--panel-2);border-radius:8px}
.lib .ltb .chk{margin-right:6px;min-width:96px;font-weight:600}.lib .lfold{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}.lib .lfold .btn{padding:4px 10px}.lib .lfold .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.lib .card .rn{width:100%;font:inherit;font-weight:700;padding:2px 4px}
.lib .lsep{width:1px;height:20px;background:var(--line)}
.lib .card .pick{position:absolute;left:7px;top:7px;width:18px;height:18px;margin:0;cursor:pointer;accent-color:var(--accent)}
.lib .card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.lib .chips{display:flex;gap:6px;flex-wrap:wrap}
.lib .chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.lib .grid{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:4px;min-height:120px}
.lib .card{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);overflow:hidden;position:relative;text-align:left;padding:0;color:var(--fg);font:inherit}
.lib .card:hover,.lib .card:focus-visible{border-color:var(--accent);outline:none}
.lib .card .im{height:104px;background:var(--panel-2) center/cover no-repeat}
.lib .card .mt{padding:6px 8px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.lib .cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.lib .lab{display:flex;flex-direction:column;gap:2px;padding:0 3px;font-size:12px}.lib .lab span{color:var(--muted);font-size:11px}
.lib .lab b{white-space:normal;word-break:break-word;line-height:1.25;cursor:text;padding:1px 3px;margin:0 -3px;border-radius:4px}.lib .lab b:hover{background:var(--panel-2)}
.lib .lab .rn{width:100%;font:inherit;font-weight:700;padding:2px 4px}
.lib .card.newfo{border-style:dashed}
.lib .card .mt b{white-space:normal;word-break:break-word;line-height:1.25}
.lib .card .mt span{color:var(--muted);font-size:11px}
.lib .card .mt .inf{display:flex;align-items:center;gap:4px;color:var(--accent)}
.lib .card.fold .im.mos{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px}.lib .card.fold .mos i{background:center/cover no-repeat var(--panel);border-radius:3px}.lib .card.fold .mos .emp{grid-column:1/-1;align-self:center;text-align:center;color:var(--muted)}
.lib .card.fold{border-color:var(--accent)}.lib .card.over,.lib .lfold .btn.over{outline:2px dashed var(--accent);outline-offset:2px}
.lib .lfold .crumb{display:flex;align-items:center;gap:6px;color:var(--fg)}
.lib .card .tag{position:absolute;left:6px;top:80px;font-family:var(--f-mono);font-size:10px;background:rgb(0 0 0/.7);color:#fff;padding:1px 5px;border-radius:3px}
.lib .card .ncount{position:absolute;right:6px;top:80px;display:flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:11px;font-weight:700;background:rgb(0 0 0/.72);color:#fff;padding:1px 6px;border-radius:10px;pointer-events:none}
.lib .card .ncount svg{width:12px;height:12px}
.lib .card .x{position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);font-size:11px;line-height:16px;display:none;cursor:pointer;padding:0;color:var(--fg)}
.lib .card:hover .x,.lib .card:focus-within .x{display:block}
.saf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.saf .btn{flex-direction:column;align-items:flex-start;gap:2px;white-space:normal;padding:9px 11px}.saf .btn span{font-weight:400;font-size:11px;color:var(--muted)}
.lib .empty{grid-column:1/-1;color:var(--muted);padding:30px;text-align:center}
.thumb .tag{position:absolute;left:4px;bottom:4px;font-family:var(--f-mono);font-size:10px;background:rgb(0 0 0/.7);color:#fff;padding:1px 4px;border-radius:3px}
.thumb .x{position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);font-size:11px;line-height:14px;display:none;cursor:pointer;padding:0;color:var(--fg)}
.thumb:hover .x,.thumb:focus-within .x{display:block}
.status{grid-area:status;display:flex;gap:18px;align-items:center;padding:3px 16px;background:var(--chrome);border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.status b{color:var(--fg);font-weight:500}
.empty-msg{margin:auto;max-width:440px;text-align:center;padding:24px;display:none}
.stage.empty .empty-msg{display:block}
.empty-msg h2{font-size:20px;margin:0 0 8px;text-wrap:balance}
/* overlays */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;max-width:min(560px,90vw);z-index:50;box-shadow:0 6px 20px rgb(0 0 0/.4);line-height:1.4}
.recbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;z-index:40;box-shadow:0 6px 20px rgb(0 0 0/.4)}
.recbar .dot{width:10px;height:10px;border-radius:50%;background:var(--rec);animation:pulse 1s infinite}
.recbar .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.25}}
.count{position:fixed;inset:0;display:grid;place-items:center;font-size:120px;font-weight:800;color:var(--accent);background:rgb(0 0 0/.45);z-index:60;pointer-events:none}
.modal{position:fixed;inset:0;background:rgb(0 0 0/.55);display:grid;place-items:center;z-index:70;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(760px,100%);max-height:80vh;overflow:auto}
.modal h2{margin:0 0 12px;font-size:16px}
.wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.wins button{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.wins button:hover{border-color:var(--accent)}
.wins img{width:100%;aspect-ratio:16/10;object-fit:contain;background:#000;border-radius:4px}
.wins span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.recbar .dot{animation:none}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto auto;grid-template-areas:"top" "rail" "stage" "props" "tray" "status";height:auto;min-height:100%}
  .props{border-left:0;border-top:1px solid var(--line);max-height:36vh}
  body{overflow:auto}
  .stage{min-height:52vh}
}
</style>
</head><body>


<div class="app" id="app">
  <header class="top">
    <div class="tleft">
    <div class="lead">
      <div class="leadrow"><div class="brand"><i></i>Saveit</div>
        <button class="btn" id="widgetBtn" hidden title="Hide the editor and keep only the small capture widget, so you can see what is behind it">Widget</button>
      </div>
      <div class="cap"><button class="go" id="capBtn" title="Capture (Ctrl+Shift+X)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><span id="capLbl">Capture</span></button></div>
    </div>
    <div class="seg" role="group" aria-label="Capture type">
      <button id="mImg" aria-pressed="true">Image</button>
      <button id="mVid" aria-pressed="false">Video</button>
    </div>
    <label class="sel">Selection
      <select id="area"><option value="region">Region</option><option value="window">Window</option><option value="screen">Full screen</option><option value="steps">Steps (click to capture)</option><option value="scroll">Scrolling</option><option value="text">Grab text</option></select>
    </label>
