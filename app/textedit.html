<!doctype html>
<html><head><meta charset="utf-8"><title>Saveit Grab Text</title>
<style>
:root{--bg:#16181a;--panel:#1e2124;--panel2:#26292d;--line:#3a3f45;--fg:#e8eaec;--dim:#9aa1a8;--acc:#2db3a0;--accfg:#06211d;--red:#e5483b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column}
button,select,input{font:inherit;color:var(--fg)}
button{background:#30343a;border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap;font-weight:600;display:inline-flex;align-items:center;gap:6px}
button:hover:not(:disabled){border-color:#9aa1a8}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--accfg)}button.pri:hover:not(:disabled){filter:brightness(1.08);border-color:var(--acc)}
button[aria-pressed=true]{background:#2a4a45;border-color:var(--acc)}
select,input[type=text],input[type=search]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;height:30px}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-right:4px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--acc);display:grid;place-items:center}
.brand i::after{content:"T";font-style:normal;color:var(--accfg);font-weight:800;font-size:13px}
#name{width:170px;min-width:120px;flex:0 1 170px}
.sp{flex:1}
.fmt{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.fmt button{padding:4px 8px;min-width:30px;justify-content:center;height:30px}
.fmt .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.fmt select{height:30px}
.fmt input[type=color]{width:30px;height:30px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);cursor:pointer}
.colr{display:inline-flex;align-items:center;gap:2px}
.find{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:#202428;flex-wrap:wrap}
.find label{display:flex;align-items:center;gap:4px;color:var(--dim)}
#findCount{color:var(--dim);min-width:80px}
.main{flex:1;display:flex;min-height:0}
.docwrap{flex:1;overflow:auto;background:#2b2f34;padding:22px 18px;min-width:0}
#doc{background:#fff;color:#111;max-width:820px;min-height:calc(100% - 4px);margin:0 auto;padding:36px 44px;border-radius:3px;box-shadow:0 2px 12px rgba(0,0,0,.35);outline:none;white-space:pre-wrap;word-wrap:break-word;tab-size:6;font:11pt/1.45 "Segoe UI","Calibri",sans-serif;transform-origin:top center}
#doc.nowrap{white-space:pre;overflow-x:auto}
#doc table{border-collapse:collapse;margin:6px 0;white-space:normal}#doc td,#doc th{border:1px solid #b9c0c7;padding:3px 8px;vertical-align:top}
#doc h1{font-size:20pt;margin:.3em 0}#doc h2{font-size:16pt;margin:.3em 0}#doc h3{font-size:13pt;margin:.3em 0}
#doc blockquote{margin:.3em 0 .3em 1.2em;padding-left:10px;border-left:3px solid #c5cbd1;color:#444}
#doc pre{font:10pt/1.4 Consolas,"Courier New",monospace;background:#f3f4f6;padding:6px 8px;border-radius:4px;margin:.3em 0}
#doc ::selection{background:#b8e6df}
#doc mark.hit{background:#ffe27a;color:inherit}
.pic{width:38%;max-width:520px;min-width:200px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.pic h3{margin:0;padding:8px 10px;font-size:12px;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:6px}
.pic .imgbox{flex:1;overflow:auto;padding:6px 10px 10px}
.pic img{max-width:100%;display:block;image-rendering:auto;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.pic img.full{max-width:none;cursor:zoom-out}
.status{display:flex;align-items:center;gap:12px;padding:5px 10px;border-top:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:12px;flex-wrap:wrap}
.status select{height:26px;max-width:320px;font-size:12px}
#state.unsaved{color:#f1b860}#state.saved{color:#5fd0bd}
.banner{padding:8px 12px;background:#33302a;color:#f3d79b;border-bottom:1px solid var(--line)}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(22,24,26,.55);font-size:15px;font-weight:600;z-index:5}
.loading span::before{content:"";display:inline-block;width:16px;height:16px;border:3px solid var(--acc);border-right-color:transparent;border-radius:50%;margin-right:10px;vertical-align:-3px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu{position:fixed;z-index:20;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:220px}
.menu button{display:flex;width:100%;border:0;background:transparent;border-radius:5px;padding:6px 10px;font-weight:500;justify-content:space-between}
.menu button:hover{background:#3a3f45}.menu kbd{color:var(--dim);font:11px inherit}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#30343a;border:1px solid var(--line);padding:8px 14px;border-radius:8px;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.35)}
[hidden]{display:none!important}
svg{width:15px;height:15px}
</style></head>
<body>
<div class="top">
  <span class="brand"><i></i>Grab Text</span>
  <input type="text" id="name" aria-label="Name" placeholder="Name" title="Name used in the library and for saved files">
  <button class="pri" id="saveLib" title="Save this text in the Saveit library (Ctrl+S)">Save to library</button>
  <button id="copyAll" title="Copy all the text (Ctrl+Shift+C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>Copy all</button>
  <button id="saveAs" title="Save as a file (Ctrl+Shift+S)">Save as…</button>
  <button id="print" title="Print (Ctrl+P)">Print</button>
  <span class="sp"></span>
  <button id="grab" title="Grab text from another area of the screen (Ctrl+G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M9 9h6M12 9v7"/></svg>Grab again</button>
  <button id="picBtn" aria-pressed="true" title="Show the picture the text was read from, to check it">Picture</button>
  <button id="editor" title="Bring the Saveit editor forward">Editor</button>
</div>
<div class="fmt" role="toolbar" aria-label="Formatting">
  <button data-cmd="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button data-cmd="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <span class="sep"></span>
  <select id="block" aria-label="Paragraph style" title="Paragraph style"><option value="div">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option><option value="pre">Code</option></select>
  <select id="font" aria-label="Font" title="Font"><option value="">Font</option><option>Segoe UI</option><option>Calibri</option><option>Arial</option><option>Verdana</option><option>Georgia</option><option>Times New Roman</option><option>Consolas</option><option>Courier New</option></select>
  <select id="size" aria-label="Text size" title="Text size"><option value="">Size</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>36</option><option>48</option></select>
  <span class="sep"></span>
  <button data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
  <button data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
  <button data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
  <button data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
  <span class="colr" title="Text colour"><input type="color" id="fore" value="#c62828" aria-label="Text colour"></span>
  <span class="colr" title="Highlight"><input type="color" id="hili" value="#fff176" aria-label="Highlight colour"></span>
  <span class="sep"></span>
  <button data-cmd="justifyLeft" title="Align left" aria-label="Align left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
  <button data-cmd="justifyCenter" title="Centre" aria-label="Centre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
  <button data-cmd="justifyRight" title="Align right" aria-label="Align right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
  <button data-cmd="insertUnorderedList" title="Bullets" aria-label="Bullets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg></button>
  <button data-cmd="insertOrderedList" title="Numbering" aria-label="Numbering"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 6h10M10 12h10M10 18h10M4 4v4M3.5 14h2l-2 3h2"/></svg></button>
  <button data-cmd="outdent" title="Decrease indent" aria-label="Decrease indent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 6h9M11 12h9M11 18h9M7 9l-3 3 3 3"/></svg></button>
  <button data-cmd="indent" title="Increase indent" aria-label="Increase indent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 6h9M11 12h9M11 18h9M4 9l3 3-3 3"/></svg></button>
  <button data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 5h12M12 5l-3 14M4 20 20 4"/></svg></button>
  <span class="sep"></span>
  <button id="table" title="Turn lines with columns (tabs) into a table">Table</button>
  <button id="tools" title="Text tools: join lines, fix spacing, change case…">Text tools ▾</button>
  <button id="findBtn" title="Find and replace (Ctrl+F, Ctrl+H)">Find</button>
  <span class="sep"></span>
  <button id="wrap" aria-pressed="true" title="Wrap long lines">Wrap</button>
  <select id="zoom" aria-label="Zoom" title="Zoom"><option value="0.75">75%</option><option value="0.9">90%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select>
</div>
<div class="find" id="findBar" hidden>
  <input type="search" id="fq" placeholder="Find" aria-label="Find" style="width:200px">
  <input type="text" id="fr" placeholder="Replace with" aria-label="Replace with" style="width:200px">
  <label><input type="checkbox" id="fcase"> Match case</label>
  <button id="fprev" title="Previous (Shift+F3)">↑</button><button id="fnext" title="Next (F3)">↓</button>
  <button id="frep">Replace</button><button id="frepAll">Replace all</button>
  <span id="findCount"></span><span class="sp"></span><button id="fclose" title="Close (Esc)" aria-label="Close find">✕</button>
</div>
<div class="banner" id="banner" hidden></div>
<div class="main" style="position:relative">
  <div class="docwrap" id="docwrap"><div id="doc" contenteditable="true" spellcheck="true" aria-label="Grabbed text" role="textbox" aria-multiline="true"></div></div>
  <div class="pic" id="pic" hidden><h3>Picture the text was read from <span class="sp"></span><span style="font-weight:400">click to zoom</span></h3><div class="imgbox"><img id="picImg" alt="The grabbed area"></div></div>
  <div class="loading" id="loading" hidden><span>Reading text…</span></div>
</div>
<div class="status">
  <span id="counts">0 words</span><span id="state"></span><span class="sp"></span>
  <label>This session's grabs <select id="hist" aria-label="This session's grabs"></select></label>
</div>
<script>
const $=id=>document.getElementById(id),doc=$('doc');let entry=null,dirty=false,savedOnce=false,syncT=0,picWanted=true;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function textToHtml(t){return String(t||'').split(/\r?\n/).map(l=>'<div>'+(l?esc(l):'<br>')+'</div>').join('')}
function plain(){return doc.innerText.replace(/ /g,' ').replace(/\n$/,'')}
function toast(m,ms=2600){document.querySelectorAll('.toast').forEach(e=>e.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),ms)}
function counts(){const t=plain(),w=(t.match(/\S+/g)||[]).length,l=t?t.split('\n').length:0;$('counts').textContent=`${w} word${w===1?'':'s'} · ${t.length} character${t.length===1?'':'s'} · ${l} line${l===1?'':'s'}`;$('copyAll').disabled=!t.trim();$('saveLib').disabled=!t.trim()||(entry&&entry.loading)}
function stateLabel(){const s=$('state');if(!entry){s.textContent='';return}if(entry.libId&&!dirty){s.className='saved';s.textContent='Saved in the library';$('saveLib').textContent='Saved ✓'}else if(entry.libId){s.className='unsaved';s.textContent='Changes not saved to the library';$('saveLib').textContent='Save changes'}else{s.className='';s.textContent='Not saved to the library';$('saveLib').textContent='Save to library'}}
function sync(){clearTimeout(syncT);syncT=setTimeout(()=>{if(entry&&!entry.loading)window.te.update({key:entry.key,text:plain(),html:doc.innerHTML,name:$('name').value})},300)}
function changed(){dirty=true;counts();stateLabel();sync()}
function fillHist(list){const h=$('hist');h.innerHTML=list.map(g=>`<option value="${esc(g.key)}">${esc(new Date(g.created).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}))} · ${esc(g.libId?'★ ':'')}${esc(g.preview||g.name||'(empty)')}</option>`).join('');if(entry)h.value=entry.key;h.closest('label').hidden=list.length<2}
function showPic(){const has=!!(entry&&entry.src);$('picBtn').hidden=!has;$('pic').hidden=!has||!picWanted;$('picBtn').setAttribute('aria-pressed',has&&picWanted)}
function load(d){if(!d||!d.entry)return;entry=d.entry;dirty=!!(entry.dirty);$('name').value=entry.name||'Grabbed text';
  doc.innerHTML=entry.html||textToHtml(entry.text);$('loading').hidden=!entry.loading;doc.contentEditable=entry.loading?'false':'true';
  const b=$('banner');b.hidden=!entry.empty;b.textContent=entry.empty?'No text was found in that area. Try Grab again with a tighter box around clear text, or type it in yourself.':'';
  if(entry.src){if($('picImg').src!==entry.src)$('picImg').src=entry.src}else $('picImg').removeAttribute('src');$('picImg').classList.remove('full');
  showPic();fillHist(d.list||[]);counts();stateLabel();closeFind(true);if(!entry.loading){doc.focus();selectAll()}document.title=(entry.name||'Grabbed text')+' · Saveit Grab Text';document.body.dataset.state=entry.loading?'loading':'ready'}
window.te.onLoad(load);
function selectAll(){const r=document.createRange();r.selectNodeContents(doc);const s=getSelection();s.removeAllRanges();s.addRange(r)}
doc.addEventListener('input',changed);$('name').addEventListener('input',()=>{changed();document.title=($('name').value||'Grabbed text')+' · Saveit Grab Text'});
// ---- formatting ----
const ex=(c,v=null)=>{doc.focus();document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v);changed();refreshState()};
document.querySelectorAll('[data-cmd]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>ex(b.dataset.cmd)});
$('block').onchange=e=>{ex('formatBlock',e.target.value);};
$('font').onchange=e=>{if(e.target.value)ex('fontName',e.target.value);e.target.value=''};
$('size').onchange=e=>{const pt=e.target.value;e.target.value='';if(!pt)return;doc.focus();document.execCommand('styleWithCSS',false,true);document.execCommand('fontSize',false,'7');doc.querySelectorAll('[style*="xxx-large"]').forEach(el=>{el.style.fontSize=pt+'pt'});doc.querySelectorAll('font[size="7"]').forEach(el=>{const s=document.createElement('span');s.style.fontSize=pt+'pt';s.append(...el.childNodes);el.replaceWith(s)});changed()};
for(const id of ['fore','hili'])$(id).addEventListener('mousedown',()=>{saveSel()});
let keptRange=null;function saveSel(){const s=getSelection();if(s.rangeCount&&doc.contains(s.anchorNode))keptRange=s.getRangeAt(0).cloneRange()}
function restoreSel(){if(!keptRange)return;const s=getSelection();s.removeAllRanges();s.addRange(keptRange)}
for(const id of ['fore','hili']){const el=$(id),cmd=id==='fore'?'foreColor':'hiliteColor';el.onchange=()=>{restoreSel();ex(cmd,el.value)}}
function refreshState(){for(const b of document.querySelectorAll('[data-cmd]')){const c=b.dataset.cmd;if(['bold','italic','underline','strikeThrough','insertUnorderedList','insertOrderedList','justifyLeft','justifyCenter','justifyRight'].includes(c)){try{b.setAttribute('aria-pressed',document.queryCommandState(c))}catch(_){}}}
  try{const v=String(document.queryCommandValue('formatBlock')||'div').toLowerCase();$('block').value=['h1','h2','h3','blockquote','pre'].includes(v)?v:'div'}catch(_){}}
document.addEventListener('selectionchange',()=>{if(doc.contains(getSelection().anchorNode))refreshState()});
$('wrap').onclick=()=>{const on=$('wrap').getAttribute('aria-pressed')!=='true';$('wrap').setAttribute('aria-pressed',on);doc.classList.toggle('nowrap',!on)};
$('zoom').onchange=e=>{doc.style.zoom=e.target.value};
$('docwrap').addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const o=[...$('zoom').options].map(o=>o.value),i=o.indexOf($('zoom').value),n=Math.max(0,Math.min(o.length-1,i+(e.deltaY<0?1:-1)));$('zoom').value=o[n];doc.style.zoom=o[n]},{passive:false});
// ---- text tools (work on the selection, or on everything when nothing is selected) ----
function selText(){const s=getSelection();return s.rangeCount&&!s.isCollapsed&&doc.contains(s.anchorNode)?s.toString():null}
function replaceSelOrAll(fn){let t=selText();const all=t==null;if(all){selectAll();t=plain()}const out=fn(t);if(out===t){toast('Nothing to change.');return}doc.focus();document.execCommand('insertHTML',false,all?textToHtml(out):out.split('\n').map(esc).join('<br>'));changed()}
const titleCase=s=>s.toLowerCase().replace(/(^|[\s\t"'(\[-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const sentenceCase=s=>s.toLowerCase().replace(/(^\s*|[.!?]\s+|\n\s*)(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const TOOLS=[
 ['Join lines into one paragraph',t=>t.split('\n').map(s=>s.trim()).filter(Boolean).join(' ').replace(/(\w)- (\w)/g,'$1$2')],
 ['Join wrapped lines (keep paragraphs)',t=>t.split(/\n\s*\n/).map(p=>p.split('\n').map(s=>s.trim()).filter(Boolean).join(' ')).join('\n\n')],
 ['Remove blank lines',t=>t.split('\n').filter(s=>s.trim()).join('\n')],
 ['Fix spacing (extra spaces, spaces at line ends)',t=>t.split('\n').map(s=>s.replace(/[  ]{2,}/g,' ').replace(/ +([,.;:!?%)\]])/g,'$1').replace(/([(\[]) +/g,'$1').trim()).join('\n')],
 ['Columns: tabs to spaces',t=>t.replace(/\t+/g,'  ')],
 null,
 ['UPPERCASE',t=>t.toUpperCase()],['lowercase',t=>t.toLowerCase()],['Title Case',titleCase],['Sentence case',sentenceCase],
 null,
 ['Straight quotes and dashes',t=>t.replace(/[‘’‚′]/g,"'").replace(/[“”„″]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...')],
 ['Keep only numbers and symbols',t=>t.split('\n').map(s=>(s.match(/[-+$£€¥]?\d[\d.,:/%-]*/g)||[]).join('\t')).filter(Boolean).join('\n')],
 ['Sort lines A–Z',t=>t.split('\n').sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'})).join('\n')],
 ['Remove duplicate lines',t=>[...new Set(t.split('\n'))].join('\n')]];
function menu(anchor,rows){document.querySelectorAll('.menu').forEach(m=>m.remove());const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');
  rows.forEach(r=>{if(!r){m.append(document.createElement('hr'));return}const b=document.createElement('button');b.setAttribute('role','menuitem');b.innerHTML=`<span>${esc(r[0])}</span>${r[2]?`<kbd>${esc(r[2])}</kbd>`:''}`;b.onmousedown=e=>e.preventDefault();b.onclick=()=>{m.remove();r[1]()};m.append(b)});
  document.body.append(m);const a=anchor.getBoundingClientRect();m.style.left=Math.min(a.left,innerWidth-m.offsetWidth-8)+'px';m.style.top=(a.bottom+4)+'px';
  setTimeout(()=>addEventListener('mousedown',function off(e){if(!m.contains(e.target)){m.remove();removeEventListener('mousedown',off)}}),0)}
$('tools').onmousedown=e=>e.preventDefault();
$('tools').onclick=()=>menu($('tools'),TOOLS.map(r=>r&&[r[0],()=>replaceSelOrAll(r[1])]));
// Lines with tab-separated columns become a table (copies into Word and Excel as a real table)
$('table').onmousedown=e=>e.preventDefault();
$('table').onclick=()=>{let t=selText();if(t==null){selectAll();t=plain()}const lines=t.split('\n');if(!lines.some(l=>l.includes('\t'))){toast('No columns found. Grab Text puts a tab between table columns.');return}
  let html='',rows=[];const flush=()=>{if(!rows.length)return;const n=Math.max(...rows.map(r=>r.length));html+='<table>'+rows.map(r=>'<tr>'+Array.from({length:n},(_,i)=>'<td>'+(r[i]?esc(r[i]):'<br>')+'</td>').join('')+'</tr>').join('')+'</table>';rows=[]};
  for(const l of lines){if(l.includes('\t'))rows.push(l.split('\t'));else{flush();html+='<div>'+(l?esc(l):'<br>')+'</div>'}}flush();doc.focus();document.execCommand('insertHTML',false,html);changed()};
// ---- find and replace ----
let hits=[],hitI=-1;
function findAll(){hits=[];hitI=-1;const q=$('fq').value;if(!q){$('findCount').textContent='';return}const cs=$('fcase').checked,needle=cs?q:q.toLowerCase(),w=document.createTreeWalker(doc,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){const s=cs?n.data:n.data.toLowerCase();let i=0;while((i=s.indexOf(needle,i))>=0){hits.push({n,i,len:q.length});i+=q.length}}$('findCount').textContent=hits.length?`${hits.length} found`:'Not found'}
function goHit(dir){findAll();if(!hits.length)return;const s=getSelection();let from=0;if(s.rangeCount&&doc.contains(s.anchorNode)){const r=s.getRangeAt(0);from=hits.findIndex(h=>{const c=document.createRange();c.setStart(h.n,h.i);return r.compareBoundaryPoints(Range.START_TO_START,c)<(dir>0?0:1)});if(dir>0&&from<0)from=0;if(dir<0)from=(from<=0?hits.length:from)-1}else if(dir<0)from=hits.length-1;
  if(dir>0&&s.rangeCount&&!s.isCollapsed&&from>=0){const h=hits[from],r=s.getRangeAt(0);if(r.startContainer===h.n&&r.startOffset===h.i)from=(from+1)%hits.length}
  hitI=from;const h=hits[hitI],r=document.createRange();r.setStart(h.n,h.i);r.setEnd(h.n,h.i+h.len);s.removeAllRanges();s.addRange(r);(h.n.parentElement||doc).scrollIntoView({block:'nearest'});$('findCount').textContent=`${hitI+1} of ${hits.length}`}
function openFind(rep){$('findBar').hidden=false;const t=selText();if(t&&!t.includes('\n'))$('fq').value=t;(rep&&$('fq').value?$('fr'):$('fq')).focus();$('fq').select();findAll()}
function closeFind(silent){$('findBar').hidden=true;if(!silent)doc.focus()}
function selIsHit(){const s=getSelection(),q=$('fq').value;if(!q||!s.rangeCount||!doc.contains(s.anchorNode))return false;const t=s.toString();return $('fcase').checked?t===q:t.toLowerCase()===q.toLowerCase()}
$('findBtn').onclick=()=>$('findBar').hidden?openFind(false):closeFind();$('fclose').onclick=()=>closeFind();
$('fq').oninput=findAll;$('fcase').onchange=findAll;$('fnext').onclick=()=>goHit(1);$('fprev').onclick=()=>goHit(-1);
$('fq').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();goHit(e.shiftKey?-1:1)}};$('fr').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('frep').click()}};
$('frep').onclick=()=>{if(!selIsHit()){goHit(1);return}doc.focus();document.execCommand('insertText',false,$('fr').value);changed();goHit(1)};
$('frepAll').onclick=()=>{findAll();const n=hits.length;if(!n)return;for(let k=hits.length-1;k>=0;k--){const h=hits[k],r=document.createRange();r.setStart(h.n,h.i);r.setEnd(h.n,h.i+h.len);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('insertText',false,$('fr').value)}changed();findAll();toast(`Replaced ${n}`)};
// ---- copy, save, print ----
function cleanHtml(){const c=doc.cloneNode(true);c.querySelectorAll('mark.hit').forEach(m=>m.replaceWith(...m.childNodes));return c.innerHTML}
async function copyAll(){const t=plain();if(!t.trim())return;try{await window.te.copy(t,`<div style="white-space:pre-wrap">${cleanHtml()}</div>`);toast('All the text is copied. Paste it anywhere.')}catch(e){toast('Copy failed: '+(e.message||e))}}
$('copyAll').onclick=copyAll;
async function saveLib(){const t=plain();if(!t.trim()||!entry)return;$('saveLib').disabled=true;try{const r=await window.te.saveLib({key:entry.key,name:$('name').value.trim()||'Grabbed text',text:t,html:cleanHtml()});entry.libId=r.id;dirty=false;stateLabel();fillHist(r.list||[]);toast('Saved in the Saveit library')}catch(e){toast((e.message||String(e)).replace(/^Error invoking remote method '[^']+': (Error: )?/,''),6000)}finally{counts()}}
$('saveLib').onclick=saveLib;
$('saveAs').onclick=()=>menu($('saveAs'),[['Text file (.txt)',()=>saveFile('txt')],['Web page with formatting (.html, opens in Word)',()=>saveFile('html')]]);
async function saveFile(fmt){const name=$('name').value.trim()||'Grabbed text';const data=fmt==='html'?`<!doctype html><html><head><meta charset="utf-8"><title>${esc(name)}</title><style>body{font:11pt/1.45 "Segoe UI",Calibri,sans-serif;white-space:pre-wrap;max-width:820px;margin:30px auto}table{border-collapse:collapse;white-space:normal}td{border:1px solid #b9c0c7;padding:3px 8px}</style></head><body>${cleanHtml()}</body></html>`:plain();try{const p=await window.te.saveFile(name,fmt,data);if(p)toast('Saved '+p.split(/[\\/]/).pop(),4000)}catch(e){toast('Could not save: '+(e.message||e),6000)}}
$('print').onclick=()=>window.te.print();
$('editor').onclick=()=>window.te.editor();
$('grab').onclick=()=>window.te.grab();
$('picBtn').onclick=()=>{picWanted=!picWanted;showPic()};
$('picImg').onclick=()=>$('picImg').classList.toggle('full');
$('hist').onchange=async e=>{const d=await window.te.pick(e.target.value);if(d)load(d)};
addEventListener('keydown',e=>{const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
  if(c&&k==='s'){e.preventDefault();e.shiftKey?$('saveAs').click():saveLib()}
  else if(c&&e.shiftKey&&k==='c'){e.preventDefault();copyAll()}
  else if(c&&k==='f'){e.preventDefault();openFind(false)}
  else if(c&&k==='h'){e.preventDefault();openFind(true)}
  else if(c&&k==='p'){e.preventDefault();window.te.print()}
  else if(c&&k==='g'){e.preventDefault();window.te.grab()}
  else if(e.key==='F3'){e.preventDefault();if($('findBar').hidden)openFind(false);else goHit(e.shiftKey?-1:1)}
  else if(e.key==='Escape'){if(document.querySelector('.menu'))document.querySelector('.menu').remove();else if(!$('findBar').hidden)closeFind()}});
// Pasting keeps simple formatting but drops colours and backgrounds made for other pages
doc.addEventListener('paste',e=>{const h=e.clipboardData.getData('text/html');if(!h)return;e.preventDefault();const t=document.createElement('template');t.innerHTML=h;t.content.querySelectorAll('script,style,meta,link').forEach(x=>x.remove());t.content.querySelectorAll('*').forEach(x=>{x.removeAttribute('class');x.removeAttribute('id');if(x.style){x.style.removeProperty('color');x.style.removeProperty('background');x.style.removeProperty('background-color');x.style.removeProperty('font-family')}});document.execCommand('insertHTML',false,t.innerHTML)});
counts();stateLabel();
</script></body></html>
