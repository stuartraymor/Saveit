<!doctype html>
<html><head><meta charset="utf-8"><title>Saveit Page</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob: https: http: file:; font-src data:; connect-src data: blob:">
<style>
:root{--bg:#16181a;--panel:#1e2124;--panel2:#26292d;--line:#3a3f45;--fg:#e8eaec;--dim:#9aa1a8;--acc:#2db3a0;--accfg:#06211d;--red:#e5483b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column}
button,select,input{font:inherit;color:var(--fg)}
button{background:#30343a;border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap;font-weight:600;display:inline-flex;align-items:center;gap:6px}
button:hover:not(:disabled){border-color:#9aa1a8}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--accfg)}button.pri:hover:not(:disabled){filter:brightness(1.08);border-color:var(--acc)}
button[aria-pressed=true]{background:#2a4a45;border-color:var(--acc)}
select,input[type=text],input[type=search],input[type=url]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;height:30px}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);flex-wrap:wrap}
.top .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-right:4px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--acc);display:grid;place-items:center;color:var(--accfg);font-style:normal;font-weight:800;font-size:13px}
.brand i svg{width:15px;height:15px}
#name{width:190px;min-width:120px;flex:0 1 190px}
.sp{flex:1}
.tabs{display:flex;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:6px 12px 5px;color:var(--dim);font-weight:600}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--acc)}
.tabs button:hover{color:var(--fg)}
.fmt{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;min-height:43px}
.fmt button{padding:4px 8px;min-width:30px;justify-content:center;height:30px}
.fmt button.lbl{padding:4px 10px}
.fmt .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.fmt select{height:30px}
.fmt label.f{display:inline-flex;align-items:center;gap:6px;color:var(--dim)}
.split{display:inline-flex}.split>button:first-child{border-top-right-radius:0;border-bottom-right-radius:0}.split>button+button{border-top-left-radius:0;border-bottom-left-radius:0;border-left:0;min-width:18px;padding:4px 3px}
.swbar{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1}.swbar b{font-size:13px}.swbar i{display:block;width:16px;height:4px;border-radius:1px}
.hidecol{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.find{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:#202428;flex-wrap:wrap}
.find label{display:flex;align-items:center;gap:4px;color:var(--dim)}
#findCount{color:var(--dim);min-width:80px}
.main{flex:1;display:flex;min-height:0;position:relative}
.docwrap{flex:1;overflow:auto;background:#2b2f34;padding:22px 18px 40px;min-width:0;position:relative}
#doc{background:#fff;color:#111;margin:0 auto;border-radius:2px;box-shadow:0 2px 12px rgba(0,0,0,.35);outline:none;white-space:pre-wrap;word-wrap:break-word;tab-size:6;font:11pt/1.45 "Segoe UI","Calibri",sans-serif;caret-color:#111}
.page{width:816px;padding:96px;min-height:1056px}
#doc.nowrap{white-space:pre;overflow-x:auto}
.page table{border-collapse:collapse;margin:6px 0;white-space:normal;max-width:100%}.page td,.page th{border:1px solid #b9c0c7;padding:3px 8px;vertical-align:top;min-width:30px}
.page h1{font-size:20pt;margin:.3em 0}.page h2{font-size:16pt;margin:.3em 0}.page h3{font-size:13pt;margin:.3em 0}
.page blockquote{margin:.3em 0 .3em 1.2em;padding-left:10px;border-left:3px solid #c5cbd1;color:#444}
.page pre{font:10pt/1.4 Consolas,"Courier New",monospace;background:#f3f4f6;padding:6px 8px;border-radius:4px;margin:.3em 0}
.page ul,.page ol{margin:.2em 0;padding-left:2em;white-space:normal}.page li{white-space:pre-wrap}
.page hr{border:0;border-top:1px solid #a0a6ad;margin:10px 0}
.page a{color:#0563c1}
.page img{max-width:100%;vertical-align:bottom}
.page .pgbreak{display:block;height:0;border-top:1px dashed #9aa1a8;margin:14px 0;position:relative;user-select:none}
.page .pgbreak::after{content:"Page break";position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:#fff;color:#7a828a;font:11px "Segoe UI",sans-serif;padding:0 6px}
/* 10.5.4: header and footer preview, Title/Subtitle/Heading 4, contents, footnotes, format painter */
#doc{position:relative}
#doc::before,#doc::after{position:absolute;left:var(--pm,96px);right:var(--pm,96px);color:#8a9199;font:9pt "Segoe UI",sans-serif;white-space:pre;overflow:hidden;text-overflow:ellipsis;pointer-events:none;user-select:none}
#doc::before{content:attr(data-hdr);top:calc(var(--pm,96px) / 2 - 8px)}
#doc::after{content:attr(data-ftr);bottom:calc(var(--pm,96px) / 2 - 8px)}
#doc.numright::after{text-align:right}#doc.numcentre::after{text-align:center}
#doc.painting{cursor:copy}
.page .pgset{display:none}
.page h4{font-size:11.5pt;margin:.3em 0;font-style:italic}
.page .p-title{font-size:26pt;font-weight:600;line-height:1.2;margin:.15em 0 .1em}
.page .p-subtitle{font-size:14pt;color:#5a6168;margin:0 0 .5em}
.page .toc{border:1px solid #d5dae0;border-radius:4px;padding:8px 14px;margin:8px 0;white-space:normal;user-select:none}
.page .toc .toc-t{font-weight:700;font-size:13pt;margin-bottom:4px}
.page .toc>div:not(.toc-t){cursor:pointer;color:#0b4f9c;padding:1px 0}.page .toc>div:not(.toc-t):hover{text-decoration:underline}
.page .toc .toc-2{margin-left:.3in}.page .toc .toc-3{margin-left:.6in}.page .toc .toc-4{margin-left:.9in}
.page sup.fnref{color:#0b4f9c;cursor:default;font-size:.7em;user-select:all}
.page .fnotes{border-top:1px solid #a0a6ad;margin-top:24px;padding-top:6px;font-size:9.5pt}
.page .fnotes .fn{margin:2px 0}.page .fnotes .fn-n{color:#5a6168}
/* 10.5.3: text set in columns (Layout > Columns) and column breaks */
.page .cols{column-gap:.5in;margin:0}
.page .colbreak{display:block;height:0;border-top:1px dotted #9aa1a8;margin:10px 0;position:relative;user-select:none;break-after:column}
.page .colbreak::after{content:"Column break";position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:#fff;color:#7a828a;font:11px "Segoe UI",sans-serif;padding:0 6px;white-space:nowrap}
#doc ::selection{background:#b8e6df}
#doc mark.hit{background:#ffe27a;color:inherit}
#doc.dropping{outline:2px dashed var(--acc);outline-offset:4px}
/* picture selection */
#imgsel{position:absolute;border:1.5px solid var(--acc);z-index:4;cursor:move;touch-action:none}
#imgsel .h{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid var(--acc);border-radius:2px;margin:-6px 0 0 -6px}
#imgsel .h[data-h=nw]{left:0;top:0;cursor:nwse-resize}#imgsel .h[data-h=n]{left:50%;top:0;cursor:ns-resize}#imgsel .h[data-h=ne]{left:100%;top:0;cursor:nesw-resize}
#imgsel .h[data-h=e]{left:100%;top:50%;cursor:ew-resize}#imgsel .h[data-h=se]{left:100%;top:100%;cursor:nwse-resize}#imgsel .h[data-h=s]{left:50%;top:100%;cursor:ns-resize}
#imgsel .h[data-h=sw]{left:0;top:100%;cursor:nesw-resize}#imgsel .h[data-h=w]{left:0;top:50%;cursor:ew-resize}
#imgsel.cropping{cursor:default;border-color:transparent;overflow:visible}
#imgsel.cropping>.h{display:none}
#crop{position:absolute;box-shadow:0 0 0 9999px rgba(10,12,14,.55);border:1.5px dashed #fff;cursor:move}
#crop .h{position:absolute;width:14px;height:14px;background:#111;border:2px solid #fff;margin:-7px 0 0 -7px;border-radius:0}
#imgclip{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#imgclip #crop{pointer-events:auto}
#imgbar{position:absolute;left:0;bottom:calc(100% + 8px);display:flex;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:default;white-space:nowrap;z-index:6}
#imgbar.below{bottom:auto;top:calc(100% + 8px)}
#imgbar button{height:28px;padding:3px 8px;font-weight:600;font-size:12px}
#imgbar .sep{width:1px;background:var(--line);margin:2px 3px}
#imgsize{position:absolute;right:0;top:calc(100% + 4px);background:rgba(20,22,24,.85);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px;pointer-events:none}
.pic{width:38%;max-width:520px;min-width:200px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.pic h3{margin:0;padding:8px 10px;font-size:12px;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:6px}
.pic .imgbox{flex:1 1 55%;min-height:70px;overflow:auto;padding:6px 10px 10px}
/* 10.5.3: the text read from the picture, under it, ready to copy or put into the page */
.pic .gt{flex:1 1 45%;min-height:150px;display:flex;flex-direction:column;gap:6px;padding:0 10px 10px;border-top:1px solid var(--line)}
.pic .gt h3{padding:8px 0 0}
.pic .gt textarea{flex:1;min-height:60px;resize:none;background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.45 "Segoe UI",system-ui,sans-serif;white-space:pre-wrap;outline-offset:1px}
.pic .gt .row{display:flex;gap:6px;flex-wrap:wrap}
.pic .gt .row button{height:28px;padding:3px 9px;font-size:12px}
.pic img{max-width:100%;display:block;image-rendering:auto;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.pic img.full{max-width:none;cursor:zoom-out}
.status{display:flex;align-items:center;gap:12px;padding:5px 10px;border-top:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:12px;flex-wrap:wrap}
.status select{height:26px;max-width:320px;font-size:12px}
.status button{height:26px;padding:2px 8px;font-size:12px}
#state.unsaved{color:#f1b860}#state.saved{color:#5fd0bd}
.banner{padding:8px 12px;background:#33302a;color:#f3d79b;border-bottom:1px solid var(--line)}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(22,24,26,.55);font-size:15px;font-weight:600;z-index:5}
.loading span::before{content:"";display:inline-block;width:16px;height:16px;border:3px solid var(--acc);border-right-color:transparent;border-radius:50%;margin-right:10px;vertical-align:-3px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu{position:fixed;z-index:20;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:220px;max-height:calc(100vh - 16px);overflow:auto}
.menu button{display:flex;width:100%;border:0;background:transparent;border-radius:5px;padding:6px 10px;font-weight:500;justify-content:space-between;gap:18px}
.menu button:hover:not(:disabled){background:#3a3f45}.menu kbd{color:var(--dim);font:11px inherit}
.menu button.sugg{font-weight:700}
.menu .head{padding:4px 10px 2px;color:var(--dim);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .grid{display:grid;gap:3px;padding:4px}
.menu .grid button{width:auto;padding:0;justify-content:center;border:1px solid transparent}
.menu .pal button{width:22px;height:22px;border-radius:4px;border:1px solid rgba(255,255,255,.18)}
.menu .pal button:hover{outline:2px solid var(--fg);outline-offset:1px}
.menu .sym button{width:30px;height:30px;font-size:16px}
.menu .tgrid{grid-template-columns:repeat(8,18px);gap:2px}
.menu .tgrid i{width:18px;height:18px;border:1px solid #5a6168;border-radius:2px;display:block;cursor:pointer}
.menu .tgrid i.on{background:#2a4a45;border-color:var(--acc)}
.menu .tlabel{text-align:center;color:var(--dim);padding:4px 0 2px;font-size:12px}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#30343a;border:1px solid var(--line);padding:8px 14px;border-radius:8px;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:40}
.modal form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:340px;max-width:92vw;box-shadow:0 12px 32px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px}
.modal h2{margin:0 0 2px;font-size:15px}
.modal label{display:flex;flex-direction:column;gap:4px;color:var(--dim);font-size:12px}
.modal input{width:100%}
.modal p{margin:0;color:var(--fg);line-height:1.5}
.modal table{border-collapse:collapse}.modal td{padding:3px 14px 3px 0}.modal td+td{text-align:right;font-weight:600}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
[hidden]{display:none!important}
svg{width:15px;height:15px}
@media print{
  html,body{height:auto;background:#fff;display:block;overflow:visible}
  .top,.tabs,.fmt,.find,.banner,.pic,.status,.loading,#imgsel,.menu,.toast,.modal{display:none!important}
  .main,.docwrap{display:block;overflow:visible;padding:0;background:#fff}
  #doc{box-shadow:none;margin:0;padding:0!important;width:auto!important;min-height:0!important;zoom:1!important;border-radius:0}
  #doc .pgbreak{break-after:page;border:0;margin:0}#doc .pgbreak::after{display:none}
  #doc .colbreak{border:0;margin:0}#doc .colbreak::after{display:none}
  #doc::before,#doc::after{content:none!important}
  #doc .toc{border:0;padding:0}#doc .toc>div:not(.toc-t){color:inherit}#doc sup.fnref{color:inherit}
  #doc mark.hit{background:none}
}
</style><style id="pagecss"></style></head>
<body>
<div class="top">
  <span class="brand"><i id="brandIcon"></i><span id="brandName">Page</span></span>
  <input type="text" id="name" aria-label="Name" placeholder="Name" title="Name used in the library and for saved files">
  <button id="newPage" title="Start a new blank page (Ctrl+N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg>New</button>
  <button id="openFile" title="Open a Word document, text file or web page (Ctrl+O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 7v11a1 1 0 0 0 1 1h14l3-8H7l-3 8"/></svg>Open</button>
  <button class="pri" id="saveLib" title="Save this page in the Saveit library (Ctrl+S)">Save to library</button>
  <button id="saveAs" title="Save as a Word document, PDF, web page or text file (Ctrl+Shift+S)">Save as ▾</button>
  <button id="print" title="Print (Ctrl+P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>Print</button>
  <button id="copyAll" title="Copy all the text (Ctrl+Shift+C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>Copy all</button>
  <span class="sp"></span>
  <button id="grab" title="Grab text from an area of the screen. The picture and the text read from it appear beside this page (Ctrl+G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M9 9h6M12 9v7"/></svg>Grab text</button>
  <button id="picBtn" aria-pressed="true" title="Show or hide the picture the text was read from, and the grabbed text">Picture</button>
  <button id="editor" title="Bring the Saveit editor forward">Editor</button>
</div>
<div class="tabs" role="tablist" aria-label="Ribbon">
  <button role="tab" data-tab="home" aria-selected="true">Home</button>
  <button role="tab" data-tab="insert" aria-selected="false">Insert</button>
  <button role="tab" data-tab="layout" aria-selected="false">Layout</button>
  <button role="tab" data-tab="tools" aria-selected="false">Tools</button>
</div>
<div class="fmt" role="toolbar" aria-label="Home" data-panel="home">
  <button data-cmd="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button data-cmd="redo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <span class="sep"></span>
  <select id="block" aria-label="Paragraph style" title="Paragraph style"><option value="div">Normal</option><option value="title">Title</option><option value="subtitle">Subtitle</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="h4">Heading 4</option><option value="blockquote">Quote</option><option value="pre">Code</option></select>
  <select id="font" aria-label="Font" title="Font" style="width:150px"><option value="">Font</option><option>Segoe UI</option><option>Calibri</option><option>Cambria</option><option>Arial</option><option>Verdana</option><option>Tahoma</option><option>Trebuchet MS</option><option>Georgia</option><option>Times New Roman</option><option>Garamond</option><option>Book Antiqua</option><option>Consolas</option><option>Courier New</option><option>Comic Sans MS</option></select>
  <select id="size" aria-label="Text size" title="Text size"><option value="">Size</option><option>8</option><option>9</option><option>10</option><option>10.5</option><option>11</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>32</option><option>36</option><option>48</option><option>72</option></select>
  <button id="grow" title="Bigger text (Ctrl+])" aria-label="Bigger text"><b>A</b><sup style="font-size:9px">+</sup></button>
  <button id="shrink" title="Smaller text (Ctrl+[)" aria-label="Smaller text"><span style="font-size:11px;font-weight:700">A</span><sup style="font-size:9px">−</sup></button>
  <span class="sep"></span>
  <button data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
  <button data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
  <button data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>
  <button data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
  <button data-cmd="superscript" title="Superscript (Ctrl+Shift+=)" aria-label="Superscript">x<sup style="font-size:9px">2</sup></button>
  <button data-cmd="subscript" title="Subscript (Ctrl+=)" aria-label="Subscript">x<sub style="font-size:9px">2</sub></button>
  <span class="split"><button id="foreBtn" title="Text colour" aria-label="Text colour"><span class="swbar"><b>A</b><i id="foreBar" style="background:#c62828"></i></span></button><button id="foreMore" title="Choose text colour" aria-label="Choose text colour">▾</button></span>
  <span class="split"><button id="hiliBtn" title="Highlight" aria-label="Highlight"><span class="swbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="width:13px;height:13px"><path d="m9 15 6-6 3 3-6 6H9z"/><path d="m15 9 3-3 3 3-3 3"/></svg><i id="hiliBar" style="background:#fff176"></i></span></button><button id="hiliMore" title="Choose highlight colour" aria-label="Choose highlight colour">▾</button></span>
  <input type="color" id="fore" class="hidecol" value="#c62828" aria-label="Text colour" tabindex="-1"><input type="color" id="hili" class="hidecol" value="#fff176" aria-label="Highlight colour" tabindex="-1">
  <button id="painter" aria-pressed="false" title="Format painter: copy the look of the text the cursor is in, then drag over other text to give it the same look" aria-label="Format painter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3" width="13" height="6" rx="1.5"/><path d="M17 6h3v6h-8v3"/><rect x="10.5" y="15" width="3" height="6" rx="1"/></svg></button>
  <button data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 5h12M12 5l-3 14M4 20 20 4"/></svg></button>
  <span class="sep"></span>
  <button data-cmd="justifyLeft" title="Align left (Ctrl+L)" aria-label="Align left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
  <button data-cmd="justifyCenter" title="Centre (Ctrl+E)" aria-label="Centre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
  <button data-cmd="justifyRight" title="Align right (Ctrl+R)" aria-label="Align right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
  <button data-cmd="justifyFull" title="Justify (Ctrl+J)" aria-label="Justify"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg></button>
  <span class="sep"></span>
  <span class="split"><button data-cmd="insertUnorderedList" title="Bullets (Ctrl+Shift+L)" aria-label="Bullets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg></button><button id="bulletMore" title="Bullet styles" aria-label="Bullet styles">▾</button></span>
  <span class="split"><button data-cmd="insertOrderedList" title="Numbering" aria-label="Numbering"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 6h10M10 12h10M10 18h10M4 4v4M3.5 14h2l-2 3h2"/></svg></button><button id="numberMore" title="Numbering styles" aria-label="Numbering styles">▾</button></span>
  <button data-cmd="outdent" title="Decrease indent (Shift+Tab in a list)" aria-label="Decrease indent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 6h9M11 12h9M11 18h9M7 9l-3 3 3 3"/></svg></button>
  <button data-cmd="indent" title="Increase indent (Tab in a list)" aria-label="Increase indent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 6h9M11 12h9M11 18h9M4 9l3 3-3 3"/></svg></button>
  <button id="spacing" title="Line and paragraph spacing" aria-label="Line spacing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 6h9M11 12h9M11 18h9M5 4v16M3 6l2-2 2 2M3 18l2 2 2-2"/></svg>▾</button>
</div>
<div class="fmt" role="toolbar" aria-label="Insert" data-panel="insert" hidden>
  <button class="lbl" id="insPic" title="Insert a picture from a file (you can also drop or paste pictures)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 5 5 3-3 4 4"/></svg>Picture</button>
  <button class="lbl" id="insTable" title="Insert a table"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg>Table ▾</button>
  <button class="lbl" id="insLink" title="Insert a link (Ctrl+K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Link</button>
  <span class="sep"></span>
  <button class="lbl" id="insHr" title="Insert a horizontal line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18"/></svg>Line</button>
  <button class="lbl" id="insBreak" title="Start a new page here when printed or saved (Ctrl+Enter)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v5h12V3M6 21v-5h12v5M3 12h3M9 12h2M13 12h2M18 12h3"/></svg>Page break</button>
  <button class="lbl" id="insColBreak" title="Continue in the next column (Ctrl+Shift+Enter). For text set in columns."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16M20 4v16M12 3v3M12 9v2M12 14v2M12 19v2"/></svg>Column break</button>
  <span class="sep"></span>
  <button class="lbl" id="insToc" title="Insert a list of the headings in this page. Click it again to update the list.">Contents</button>
  <button class="lbl" id="insNote" title="Add a footnote: a small number here and the note at the end of the page">Footnote</button>
  <span class="sep"></span>
  <button class="lbl" id="insDate" title="Insert today's date">Date ▾</button>
  <button class="lbl" id="insSym" title="Insert a symbol">Ω Symbol ▾</button>
  <button class="lbl" id="insCheck" title="Insert a tick box (click it to tick)">☐ Tick box</button>
  <input type="file" id="picFile" accept="image/*" multiple hidden>
</div>
<div class="fmt" role="toolbar" aria-label="Layout" data-panel="layout" hidden>
  <label class="f">Page size <select id="pgSize"><option value="letter">Letter (8.5 × 11 in)</option><option value="a4">A4 (210 × 297 mm)</option><option value="legal">Legal (8.5 × 14 in)</option><option value="executive">Executive (7.25 × 10.5 in)</option><option value="tabloid">Tabloid (11 × 17 in)</option><option value="a3">A3 (297 × 420 mm)</option><option value="a5">A5 (148 × 210 mm)</option></select></label>
  <label class="f">Orientation <select id="pgOrient"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></label>
  <label class="f">Margins <select id="pgMargin"><option value="0.5">Narrow (0.5 in)</option><option value="0.75">Moderate (0.75 in)</option><option value="1">Normal (1 in)</option><option value="1.5">Wide (1.5 in)</option><option value="custom">Custom…</option></select></label>
  <button class="lbl" id="colsBtn" title="Set the text in one, two or more columns. Select text first to change only that part."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h6M4 9h6M4 13h6M4 17h6M14 5h6M14 9h6M14 13h6M14 17h6"/></svg>Columns ▾</button>
  <button class="lbl" id="hfBtn" title="Text at the top and bottom of every page, and page numbers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 17h8"/></svg>Header &amp; footer</button>
  <span class="sep"></span>
  <button id="wrap" aria-pressed="true" title="Wrap long lines">Wrap</button>
  <label class="f">Zoom <select id="zoom" aria-label="Zoom" title="Zoom (Ctrl+mouse wheel)"><option value="0.5">50%</option><option value="0.75">75%</option><option value="0.9">90%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
  <button id="fitWidth" title="Zoom so the page fills the window width">Fit width</button>
</div>
<div class="fmt" role="toolbar" aria-label="Tools" data-panel="tools" hidden>
  <button class="lbl" id="findBtn" title="Find and replace (Ctrl+F, Ctrl+H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>Find</button>
  <button class="lbl" id="tools" title="Text tools: join lines, fix spacing, change case…">Text tools ▾</button>
  <button class="lbl" id="table" title="Turn lines with columns (tabs) into a table">Table from columns</button>
  <span class="sep"></span>
  <button class="lbl" id="spellBtn" aria-pressed="true" title="Underline spelling mistakes. Right-click a word for suggestions.">Spelling</button>
  <button class="lbl" id="wcBtn" title="Word count">Word count</button>
</div>
<div class="find" id="findBar" hidden>
  <input type="search" id="fq" placeholder="Find" aria-label="Find" style="width:200px">
  <input type="text" id="fr" placeholder="Replace with" aria-label="Replace with" style="width:200px">
  <label><input type="checkbox" id="fcase"> Match case</label>
  <button id="fprev" title="Previous (Shift+F3)">↑</button><button id="fnext" title="Next (F3)">↓</button>
  <button id="frep">Replace</button><button id="frepAll">Replace all</button>
  <span id="findCount"></span><span class="sp"></span><button id="fclose" title="Close (Esc)" aria-label="Close find">✕</button>
</div>
<div class="banner" id="banner" hidden></div>
<div class="main">
  <div class="docwrap" id="docwrap"><div id="doc" class="page" contenteditable="true" spellcheck="true" aria-label="Page" role="textbox" aria-multiline="true"></div>
    <div id="imgsel" hidden><div id="imgclip"><div id="crop" hidden><span class="h" data-c="nw" style="left:0;top:0;cursor:nwse-resize"></span><span class="h" data-c="ne" style="left:100%;top:0;cursor:nesw-resize"></span><span class="h" data-c="se" style="left:100%;top:100%;cursor:nwse-resize"></span><span class="h" data-c="sw" style="left:0;top:100%;cursor:nesw-resize"></span><span class="h" data-c="n" style="left:50%;top:0;cursor:ns-resize"></span><span class="h" data-c="s" style="left:50%;top:100%;cursor:ns-resize"></span><span class="h" data-c="e" style="left:100%;top:50%;cursor:ew-resize"></span><span class="h" data-c="w" style="left:0;top:50%;cursor:ew-resize"></span></div></div>
      <span class="h" data-h="nw"></span><span class="h" data-h="n"></span><span class="h" data-h="ne"></span><span class="h" data-h="e"></span><span class="h" data-h="se"></span><span class="h" data-h="s"></span><span class="h" data-h="sw"></span><span class="h" data-h="w"></span>
      <div id="imgbar"></div><span id="imgsize" hidden></span></div>
  </div>
  <div class="pic" id="pic" hidden><h3>Picture the text was read from <span class="sp"></span><span style="font-weight:400">click to zoom</span></h3><div class="imgbox"><img id="picImg" alt="The grabbed area"></div>
    <div class="gt" id="gt" hidden><h3>Grabbed text <span class="sp"></span><span id="gtState" style="font-weight:400"></span></h3><textarea id="gtText" aria-label="Grabbed text" spellcheck="false"></textarea>
      <div class="row"><button id="gtCopy" title="Copy the grabbed text (or the part you selected in the box)">Copy text</button><button class="pri" id="gtInsert" title="Put the grabbed text (or the part you selected in the box) into the page where the cursor is">Insert into page</button><button id="gtInsPic" title="Put the picture into the page where the cursor is">Insert picture</button></div></div></div>
  <div class="loading" id="loading" hidden><span>Reading text…</span></div>
</div>
<div class="status">
  <span id="counts">0 words</span><span id="state"></span><span class="sp"></span>
  <label>Recent pages <select id="hist" aria-label="Recent pages"></select></label>
  <button id="closePage" title="Remove this page from the recent list">Remove</button>
</div>
<script src="docx.js"></script>
<script src="textedit.js"></script>
<script src="textedit-more.js"></script>
</body></html>
